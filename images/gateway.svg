<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0f172a">Путь запроса к модели</text>

  <!-- Сервис -->
  <rect x="30" y="80" width="170" height="130" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="115" y="115" font-size="16" font-weight="700" fill="#312e81" text-anchor="middle">Сервис</text>
  <text x="115" y="142" font-size="14" fill="#1e293b" text-anchor="middle">агент или ассистент</text>
  <text x="115" y="172" font-size="14" fill="#1e293b" text-anchor="middle">просит <tspan font-weight="700">роль</tspan>,</text>
  <text x="115" y="192" font-size="14" fill="#1e293b" text-anchor="middle">а не модель</text>
  <line x1="200" y1="145" x2="243" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Шлюз -->
  <rect x="245" y="70" width="330" height="150" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="410" y="102" font-size="17" font-weight="700" fill="#7c2d12" text-anchor="middle">Шлюз LiteLLM</text>
  <text x="263" y="134" font-size="14" fill="#1e293b">1. Проверяет ключ и месячный бюджет</text>
  <text x="263" y="160" font-size="14" fill="#1e293b">2. Выбирает модель по роли</text>
  <text x="263" y="186" font-size="14" fill="#1e293b">3. При сбое — переключается</text>
  <text x="263" y="208" font-size="12" fill="#64748b">~40 маршрутов, 5 ключей с бюджетами</text>

  <!-- Ступени -->
  <line x1="575" y1="145" x2="618" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="620" y="62" width="330" height="52" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="636" y="93" font-size="14" fill="#1e293b"><tspan font-weight="700">Ступень 1</tspan> — основная модель роли</text>
  <line x1="780" y1="114" x2="780" y2="140" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="790" y="132" font-size="11" fill="#dc2626">сбой</text>
  <rect x="620" y="142" width="330" height="52" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="636" y="173" font-size="14" fill="#1e293b"><tspan font-weight="700">Ступень 2</tspan> — модель другого семейства</text>
  <line x1="780" y1="194" x2="780" y2="220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="790" y="212" font-size="11" fill="#dc2626">сбой</text>
  <rect x="620" y="222" width="330" height="52" rx="10" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
  <text x="636" y="253" font-size="14" fill="#1e293b"><tspan font-weight="700">Ступень 3</tspan> — другой провайдер</text>

  <!-- Langfuse -->
  <line x1="410" y1="220" x2="410" y2="298" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="245" y="300" width="330" height="96" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="410" y="332" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Langfuse</text>
  <text x="410" y="358" font-size="14" fill="#1e293b" text-anchor="middle">каждый вызов: запрос, ответ,</text>
  <text x="410" y="378" font-size="14" fill="#1e293b" text-anchor="middle">время и стоимость по ключу</text>

  <text x="620" y="320" font-size="14" fill="#475569">Смена модели — одна правка в шлюзе.</text>
  <text x="620" y="344" font-size="14" fill="#475569">Сервисы о ней не знают.</text>
</svg>
